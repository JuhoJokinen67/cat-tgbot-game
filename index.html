<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roll a Die</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            margin-bottom: 30px;
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .die {
            width: 150px;
            height: 150px;
            background: rgba(255,255,255,0.9);
            color: #667eea;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px auto;
            font-size: 80px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .die.rolling {
            animation: roll 0.5s ease-in-out;
        }
        @keyframes roll {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(90deg) scale(1.1); }
            50% { transform: rotate(180deg) scale(0.9); }
            75% { transform: rotate(270deg) scale(1.1); }
        }
        button {
            background: rgba(255,255,255,0.9);
            color: #667eea;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        button:active {
            transform: scale(0.95);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: 500;
            min-height: 30px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        .history {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        .history h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }
        .rolls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .roll-item {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 Roll the Die</h1>

        <div class="die" id="die">🎲</div>

        <button id="rollBtn" onclick="rollDie()">Roll!</button>

        <div class="result" id="result"></div>

        <div class="history">
            <h3>Recent Rolls</h3>
            <div class="rolls" id="history"></div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const dieEl = document.getElementById('die');
        const resultEl = document.getElementById('result');
        const historyEl = document.getElementById('history');
        const rollBtn = document.getElementById('rollBtn');

        let history = [];
        let totalScore = 0;
        const maxHistory = 10;

        const diceEmojis = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

        function rollDie() {
            rollBtn.disabled = true;
            dieEl.classList.add('rolling');
            resultEl.textContent = '';

            let count = 0;
            const interval = setInterval(() => {
                const random = Math.floor(Math.random() * 6);
                dieEl.textContent = diceEmojis[random];
                count++;

                if (count > 8) {
                    clearInterval(interval);
                    const finalRoll = Math.floor(Math.random() * 6) + 1;
                    dieEl.textContent = diceEmojis[finalRoll - 1];
                    dieEl.classList.remove('rolling');

                    totalScore += finalRoll;
                    resultEl.textContent = `You rolled a ${finalRoll}! Total: ${totalScore}`;

                    history.unshift(finalRoll);
                    if (history.length > maxHistory) history.pop();
                    updateHistory();

                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.impactOccurred('medium');
                    }

                    rollBtn.disabled = false;
                }
            }, 100);
        }

        function updateHistory() {
            historyEl.innerHTML = history.map(roll =>
                `<div class="roll-item">${diceEmojis[roll - 1]}</div>`
            ).join('');
        }

        function submitScore() {
            if (totalScore > 0) {
                const data = JSON.stringify({score: totalScore, rolls: history.length});
                tg.sendData(data);
            }
        }

        tg.MainButton.text = 'Submit Score';
        tg.MainButton.color = '#667eea';
        tg.MainButton.onClick(submitScore);
        tg.MainButton.show();
    </script>
</body>
</html>
